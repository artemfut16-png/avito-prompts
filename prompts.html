<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Промпты для обработки фото</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #F5F1E8;
    --surface: #FBF8F2;
    --surface-2: #F0EAD9;
    --ink: #22252B;
    --ink-2: #5B5A54;
    --muted: #8B8A82;
    --line: #E4DFD1;
    --accent: #C4611B;
    --accent-ink: #FBF8F2;
    --good: #0c8a0c;
    --shadow: 0 1px 2px rgba(34, 37, 43, .05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #14171A;
      --surface: #1C2024;
      --surface-2: #23282D;
      --ink: #EDEAE0;
      --ink-2: #C7C4B8;
      --muted: #8B8A82;
      --line: #33363B;
      --accent: #E2822E;
      --accent-ink: #1C2024;
      --good: #29c22a;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.55;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 40px 20px 100px; }

  header.masthead { padding-bottom: 20px; border-bottom: 2px solid var(--ink); margin-bottom: 26px; }
  .masthead h1 {
    font-family: "Big Shoulders Display", "IBM Plex Sans", sans-serif;
    font-weight: 800;
    font-size: clamp(2rem, 6vw, 3rem);
    text-transform: uppercase;
    letter-spacing: .01em;
    margin: 0;
    line-height: .95;
  }
  .masthead p { margin: 10px 0 0; color: var(--ink-2); font-size: .95rem; max-width: 60ch; }

  nav.tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 28px; }
  nav.tabs.groups { gap: 28px; margin-bottom: 20px; border-bottom: 2px solid var(--line); }
  nav.tabs.groups button {
    font: 800 1.35rem "Big Shoulders Display", "IBM Plex Sans", sans-serif;
    text-transform: uppercase; letter-spacing: .03em;
    padding: 6px 2px 10px; margin-bottom: -2px;
    background: none; border: 0; border-bottom: 4px solid transparent; border-radius: 0;
    color: var(--muted);
  }
  nav.tabs.groups button:hover { background: none; color: var(--ink); border-color: transparent; }
  nav.tabs.groups button[aria-selected="true"]:not(:hover), nav.tabs.groups button[aria-selected="true"] { background: none; color: var(--ink); border-color: var(--accent); }
  nav.tabs button {
    font: 600 .9rem "IBM Plex Sans", sans-serif;
    padding: 10px 16px;
    background: var(--surface);
    color: var(--ink-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  nav.tabs button:hover { border-color: var(--accent); color: var(--ink); }
  nav.tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  nav.tabs .count {
    font: 500 .72rem "IBM Plex Mono", monospace;
    background: rgba(0,0,0,.12);
    border-radius: 999px;
    padding: 1px 7px;
  }
  nav.tabs button:focus-visible, .copy:focus-visible, .toggle:focus-visible, .shot:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 24px;
    box-shadow: var(--shadow);
  }
  .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .num {
    font: 600 .9rem "IBM Plex Mono", monospace;
    background: var(--accent); color: var(--accent-ink);
    border-radius: 7px; padding: 3px 11px;
  }

  .card-label { font-weight: 600; font-size: .95rem; color: var(--ink); }
  .media { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 18px; }
  .media.three { grid-template-columns: repeat(3, 1fr); }
  .media.four { grid-template-columns: repeat(2, 1fr); }
  figure { margin: 0; min-width: 0; }
  .shot {
    display: block; width: 100%; padding: 0;
    aspect-ratio: 4 / 3;
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    background: var(--surface-2);
    cursor: zoom-in;
  }
  .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .shot.empty {
    cursor: default;
    border: 1.5px dashed var(--line);
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: .8rem;
  }
  figcaption {
    margin-top: 8px;
    font-size: .72rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted);
  }
  figcaption b { color: var(--accent); font-family: "IBM Plex Mono", monospace; margin-right: 6px; }
  figcaption { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .acts { display: flex; gap: 6px; }
  .mini {
    font: 600 .72rem "IBM Plex Sans", sans-serif;
    text-transform: none; letter-spacing: 0;
    padding: 4px 10px;
    color: var(--ink-2); background: transparent;
    border: 1px solid var(--line); border-radius: 6px;
    cursor: pointer; text-decoration: none; white-space: nowrap;
  }
  .mini:hover { border-color: var(--accent); color: var(--ink); }
  .mini.done { background: var(--good); border-color: var(--good); color: #fff; }
  .mini.fail { border-color: #c0392b; color: #c0392b; }

  .prompt-label {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin-bottom: 8px;
    font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--muted);
  }
  .copy {
    font: 600 .75rem "IBM Plex Sans", sans-serif;
    padding: 6px 14px;
    background: var(--accent); color: var(--accent-ink);
    border: 0; border-radius: 7px; cursor: pointer;
    text-transform: none; letter-spacing: 0;
  }
  .copy.done { background: var(--good); color: #fff; }
  .prompt {
    position: relative;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  .prompt pre {
    margin: 0; padding: 16px 18px;
    font: 400 .78rem/1.65 "IBM Plex Mono", ui-monospace, monospace;
    white-space: pre-wrap; overflow-wrap: anywhere;
    color: var(--ink);
  }
  mark.slot { background: none; color: var(--accent); font-weight: 600; }
  .prompt.collapsed pre { max-height: 190px; overflow: hidden; }
  .prompt.collapsed::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 70px;
    background: linear-gradient(to bottom, transparent, var(--surface-2));
    pointer-events: none;
  }
  .toggle {
    margin-top: 10px;
    font: 600 .8rem "IBM Plex Sans", sans-serif;
    color: var(--accent);
    background: none; border: 0; padding: 0; cursor: pointer;
    border-bottom: 1px dashed var(--accent);
  }

  .empty-state {
    border: 1.5px dashed var(--line);
    border-radius: 14px;
    padding: 48px 20px;
    text-align: center;
    color: var(--muted);
  }

  .lightbox {
    position: fixed; inset: 0; z-index: 10;
    background: rgba(10, 12, 14, .88);
    display: flex; align-items: center; justify-content: center;
    padding: 24px; cursor: zoom-out;
  }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }

  @media (max-width: 640px) {
    .wrap { padding: 28px 16px 80px; }
    .media, .media.three, .media.four { grid-template-columns: 1fr; }
    .card { padding: 16px; }
  }
</style>
</head>

ГЛАВНЫЙ ОБЪЕКТ — МОДУЛЬНАЯ БАНЯ
Вместо бани-бочки используется ТОЧНАЯ копия модульного юнита со второго изображения:
— доски одинаковой ширины, аккуратные, без дефектов
— цвет натурального дерева, тёплый, насыщенный летним светом

Баня поднята в воздухе:
— удерживается на четырёх жёлтых монтажных стропах
— стропы идут от углов бани и сходятся в одну точку к металлическому крюку
— стропы натянуты, без провисаний
— баня висит идеально ровно, без перекосов

МАНИПУЛЯТОР И ТЕХНИКА
Справа в кадре грузовик-манипулятор:

— металлическая синяя стрела с видимыми следами эксплуатации
— крюк массивный, металлический
— кабина грузовика реалистичная, без брендов и логотипов
— стрела вытянута, создаёт диагональ кадра

ОСНОВАНИЕ И УЧАСТОК
Под баней подготовлен фундамент на винтовых сваях:
— сваи уже вкручены, расположены симметрично, верхушки на одном уровне
— видно, что баню сейчас будут опускать точно на них

Грунт:
— утрамбованная земля, следы от техники и колёс

— никакой плитки или благоустройства

ФОН, ОКРУЖЕНИЕ, ОБСТАНОВКА:
Аэрофотосъёмка с высоты птичьего полёта, угол обзора сверху под углом примерно 45–55 градусов, объектив широкоугольный. Горизонтальный формат кадра 4:3. Разрешение 8K, максимальная детализация, фотореалистичное качество, имитация съёмки на профессиональный дрон DJI с камерой Hasselblad.
Дом находится в загородном коттеджном посёлке с плотной застройкой. Участок окружён стройными высокими берёзами с белыми стволами — ранняя весна, листва только начинает распускаться, молодые светло-зелёные листочки едва проклюнулись, ветви лёгкие и полупрозрачные. Между берёзами вкраплены отдельные хвойные деревья — тёмно-зелёные ели и сосны. Деревья стоят плотно по периметру участка, стволы тонкие и высокие.
Непосредственно вокруг дома — ухоженный участок в стадии благоустройства: грунт подсохший, светло-коричневый, местами уже выровненный. На земле — первая молодая трава, пробивающаяся редкими яркими зелёными пятнами. Снег полностью сошёл. Воздух свежий, весенний.

ЗАДНИЙ ПЛАН:
За деревьями сквозь едва распустившиеся кроны берёз просматривается плотная коттеджная застройка: двухэтажные жилые дома разной архитектуры, разноцветные кровли — серые, коричневые, зелёные, выполненные из металлочерепицы и мягкой кровли. Дома расположены на соседних участках, разделены заборами и деревьями. Вдали на горизонте угадывается силуэт застройки, слегка размытый лёгкой дымкой. Перспектива уходит вдаль, пространство между домами наполнено нежной весенней зеленью.

НЕБО И ПОГОДА:
Ясный солнечный весенний день. Небо светло-голубое с редкими лёгкими белыми облаками. Видимость отличная, воздух чистый и прозрачный. Мягкий дневной свет падает под небольшим углом, создавая лёгкие тени от деревьев. Тёплый, свежий воздух с ощущением пробуждения природы. Температура около +12–15 градусов. Земля сухая, поверхности светлые.

ТЕХНИЧЕСКОЕ:
Горизонтальный формат 4:3, разрешение 8K (7680×5760 пикселей), максимальная детализация текстур коры берёз, молодой листвы, подсохшего грунта, металлочерепицы. Фотореализм уровня коммерческой аэрофотографии. Глубина резкости умеренная — дом и ближайшее окружение в фокусе, дальний план с лёгким атмосферным размытием.
Удали надпись и любой другой графический элемент с фото

Сваи черного цвета и должны по периметру быть под баней
Удали только черные палочки под домом на исходном изображении
Дом ставится на сви и висит в воздухе прямо, окно свомтрят прмо в кадр, сви параллельно дома под домом`
        },
        {
          ref: "img/modular-06-ref.webp",
          result: "img/modular-06-result.webp",
          prompt: `ОБЪЕКТ
Реалистичное, яркое, детализированное фото бани на участке..
Баня полностью соответствует исходной архитектуре — точные пропорции, материалы, конструктивные линии оригинала.
С бани удалена висящая гирлянда.

РАКУРС И СЪЁМКА
Формат горизонтальный. Высокая точка съёмки. Широкий угол.
Акцент на бане, её форме и фактуре. Никаких лишних объектов.

ОКРУЖЕНИЕ
Участок. Светлый грунт. Серый металлический забор по периметру именно на заднем фоне, по бокам его нету.

ВРЕМЯ ГОДА И ПОГОДА
Ранняя весна. Снег сошёл. Мягкий свежий весенний свет. Голубое небо с лёгкими облаками.

ТЕХНИЧЕСКИЕ ПАРАМЕТРЫ
Фотореализм 8K. Чёткие детали древесины и панелей. Формат 4:3, горизонтальный кадр.

Удали текст и другие графические эелементы`
        },
        {
          ref: "img/modular-07-ref.webp",

          prompt: `СЦЕНА И КОМПОЗИЦИЯ
Фотореалистичное репортажное фото монтажа модульного дома — горизонтальный кадр, формат 4:3, качество 8K, натуральные цвета без пересвета. Никакого текста, надписей, логотипов или инфографики на изображении.

В центре сцены — модульный дом современного с прикрепленной фотографии. Дом подвешен на стропах крана над свайным фундаментом

ВРЕМЯ ГОДА И ПОГОДА

ФОН
Частный сектор, заборы, редкие постройки соседей.
СТИЛЬ СЪЁМКИ`
        },
        {
          ref: "img/modular-09-ref.webp",

          prompt: `Фотореалистичное изображение, горизонтальный формат 4:3, максимальная детализация, качество 8K. Архитектурная и строительная фотография, естественный солнечный свет, реалистичные текстуры, четкий фокус по всему кадру.

**ДОМ (ЦЕНТРАЛЬНЫЙ ОБЪЕКТ):**
Дом взять с прикрепленного исходного фото. Строго запрещено менять конструктив, геометрию, конструкцию, форму кровли, количество, размеры и расположение окон и дверей, террасу и другие элементы, материалы, цвета и фактуры отделки. Дом остаётся точной копией с исходного фото.
Дом расположен строго по центру участка и по центру кадра. Он выглядит масштабно, крупно и монументально, доминирует над забором, краном и деревьями. Дом стоит далеко от забора. Между задней стеной дома и забором большое свободное пространство сухой земли

**СТРОПЫ И КРАН (ПОДЪЁМ ДОМА):**
Дом подвешен на жёлтых текстильных подъёмных стропах (ленточные стропы). Стропы туго натянуты, без провисания, под нагрузкой веса дома. Они заходят под дом и охватывают его снизу, поддерживая днище по бокам, затем поднимаются вверх под углом и сходятся в одной точке над крышей, на крюке крана. Стропы плотно прилегают к нижним граням дома, видны их плоская лента, швы, ровные линии натяжения. Дом висит ровно и горизонтально. Красный крюк с массивной обоймой закреплён на тросах, уходящих вверх к стреле крана.

**КРАН:**
Справа в кадре стоит автомобильный кран светло-серого цвета на грузовом шасси с бортовой платформой. Стрела телескопическая, светло-серая, поднята под углом вверх-влево над домом, с гидроцилиндром подъёма стрелы. Кран стоит на выдвинутых опорах-аутригерах с опорными плитами на сухом грунте. Колёса и шасси чистые, с лёгкой пылью сухой земли, без налипшей грязи. Российский номерной знак без читаемых цифр.

**ОСНОВАНИЕ:**
Под домом подготовлен фундамент на винтовых сваях:
— сваи черного цвета уже вкручены, стоят отдельно, расположены симметрично, верхушки на одном уровне
— видно, что дом сейчас будут опускать точно на них
— сваи расположены строго по периметру дома, под ним, и нигде больше

          prompt: `Фотореалистичный рекламный мокап: раскрытый печатный журнал (глянцевая брошюра) лежит по центру кадра на чистом белом фоне, вид строго сверху, камера смотрит перпендикулярно развороту.

— Плотная глянцевая бумага, белые страницы, разворот слегка объёмный, с естественным плавным изгибом страниц к корешку.

НЕ ДОПУСКАТЬ: искажений текста и цифр, изменения форм и материалов домов, других домов вместо приложенных, изменения планировок, размытия, шума, артефактов, водяных знаков, лишних элементов, изменения композиции относительно изображения 1.`

  /* ------------------------- рендер ------------------------- */
  const tabsEl = document.getElementById('tabs');
  const listEl = document.getElementById('list');
  const COLLAPSE_OVER = 600; // символов: длиннее — промпт свёрнут

  function el(tag, props = {}, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (k === 'class') n.className = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v);
    }
    kids.flat().forEach(c => n.append(c));
    return n;
  }

  function copyText(text, btn) {
    const done = () => {
      btn.textContent = 'Скопировано ✓';
      btn.classList.add('done');
      setTimeout(() => { btn.textContent = 'Скопировать'; btn.classList.remove('done'); }, 1600);
    };
    const fallback = () => {
      const ta = el('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;left:-9999px';
      document.body.append(ta);
      ta.select();
      try { document.execCommand('copy'); done(); } catch (e) {}
      ta.remove();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(fallback);
    } else fallback();
  }

  function openLightbox(src) {
    const box = el('div', { class: 'lightbox', role: 'dialog', 'aria-label': 'Просмотр фото' }, el('img', { src, alt: '' }));
    const close = () => { box.remove(); document.removeEventListener('keydown', onKey); };
    const onKey = e => { if (e.key === 'Escape') close(); };
    box.addEventListener('click', close);
    document.addEventListener('keydown', onKey);
    document.body.append(box);
  }

  function imgSrc(src) { return (window.IMG_DATA && window.IMG_DATA[src]) || src; }

  async function copyImage(src, btn) {
    const flash = (text, cls) => {
      const old = btn.textContent;
      btn.textContent = text; btn.classList.add(cls);
      setTimeout(() => { btn.textContent = old; btn.classList.remove(cls); }, 1800);
    };
    try {
      const img = new Image();
      img.src = imgSrc(src);
      await img.decode();
      const c = document.createElement('canvas');
      c.width = img.naturalWidth; c.height = img.naturalHeight;
      c.getContext('2d').drawImage(img, 0, 0);
      const blob = await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('blob')), 'image/png'));
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
      flash('Скопировано ✓', 'done');
    } catch (e) {
      flash('Не вышло — ПКМ по фото', 'fail');
    }
  }

  function shot(src, label, n, alt) {
    const frame = src
      ? el('button', { class: 'shot', type: 'button', 'aria-label': alt + ' — увеличить', onclick: () => openLightbox(src) },
          el('img', { src, alt, loading: 'lazy' }))
      : el('div', { class: 'shot empty' }, 'фото пока нет');
    const cap = el('figcaption', {}, el('span', {}, el('b', {}, n), label));
    if (src) {
      const copyBtn = el('button', { class: 'mini', type: 'button' }, 'Копировать');
      copyBtn.addEventListener('click', () => copyImage(src, copyBtn));
      const dl = el('a', { class: 'mini', href: imgSrc(src), download: src.split('/').pop() }, 'Скачать');
      cap.append(el('span', { class: 'acts' }, copyBtn, dl));
    }
    return el('figure', {}, frame, cap);
  }

  function card(item, i) {
    const refs = [item.ref, item.ref2, item.ref3].filter(r => r !== undefined);
    const long = item.prompt.length > COLLAPSE_OVER;
    const pre = el('pre');
    // места для подстановки данных — [] и [[ART]] — подсвечиваем; в копию текст уходит без изменений
    item.prompt.split(/(\[\[ART\]\]|\[[^\[\]]*\]|\{\})/).forEach(part => {
      pre.append(/^(\[[^\[\]]*\]|\[\[ART\]\]|\{\})$/.test(part) ? el('mark', { class: 'slot', title: 'Сюда вставить данные' }, part) : part);
    });
    const box = el('div', { class: 'prompt' + (long ? ' collapsed' : '') }, pre);

    const copyBtn = el('button', { class: 'copy', type: 'button' }, 'Скопировать');
    copyBtn.addEventListener('click', () => copyText(item.prompt, copyBtn));

    const parts = [
      el('div', { class: 'card-head' },
        el('span', { class: 'num' }, String(i + 1).padStart(2, '0')), item.label ? el('span', { class: 'card-label' }, item.label) : []),
      item.ref === undefined && item.result === undefined ? [] : el('div', { class: 'media' + (refs.length === 2 ? ' three' : refs.length === 3 ? ' four' : '') },
        refs.map((r, k) => shot(r, 'Референс', String(k + 1), 'Референс ' + (k + 1) + ', промпт ' + (i + 1))),
        shot(item.result, 'Итог', String(refs.length + 1), 'Итог, промпт ' + (i + 1))),
      el('div', { class: 'prompt-label' }, el('span', {}, item.kind || (item.label ? 'Текст' : 'Промпт')), copyBtn),
      box
    ];

    if (long) {
      const t = el('button', { class: 'toggle', type: 'button', 'aria-expanded': 'false' }, 'Показать целиком');
      t.addEventListener('click', () => {
        const open = box.classList.toggle('collapsed') === false;
        t.textContent = open ? 'Свернуть' : 'Показать целиком';
        t.setAttribute('aria-expanded', String(open));
      });
      parts.push(t);
    }
    return el('article', { class: 'card' }, parts);
  }

  const GROUPS = [
    { id: 'photo', title: 'Фотографии' },
    { id: 'texts', title: 'Заголовки и описания' },
    { id: 'prompts', title: 'Промпты' }
  ];
  const groupsEl = document.getElementById('groups');
  let curGroup = GROUPS[0].id;

  function show(id) {
    const sec = SECTIONS.find(s => s.id === id);
    curGroup = sec.group;
    groupsEl.querySelectorAll('button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.id === curGroup)));
    const inGroup = SECTIONS.filter(s => s.group === curGroup);
    tabsEl.hidden = inGroup.length < 2;
    tabsEl.replaceChildren(...inGroup.map(s => {
      const b = el('button', { type: 'button', role: 'tab', 'data-id': s.id, onclick: () => show(s.id) },
        s.title, el('span', { class: 'count' }, String(s.items.length)));
      b.setAttribute('aria-selected', String(s.id === id));
      return b;
    }));
    listEl.replaceChildren(...(sec.items.length
      ? sec.items.map(card)
      : [el('div', { class: 'empty-state' }, 'В этом разделе пока нет промптов')]));
    try { history.replaceState(null, '', '#' + id); } catch (e) {}
  }

  GROUPS.forEach(g => {
    groupsEl.append(el('button', { type: 'button', role: 'tab', 'data-id': g.id,
      onclick: () => show(SECTIONS.find(s => s.group === g.id).id) }, g.title));
  });

  const start = SECTIONS.some(s => s.id === location.hash.slice(1)) ? location.hash.slice(1) : SECTIONS[0].id;
  show(start);
</script>
